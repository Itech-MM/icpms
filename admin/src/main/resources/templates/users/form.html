<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0" th:text="${userDTO.id != null} ? 'Edit User' : 'New User'"></h4>
        <a th:href="@{/users}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to List</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/users/save}" th:object="${userDTO}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label class="form-label">Full Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone Number (Login ID) <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{phoneNumber}" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        Password <span class="text-danger" th:if="${userDTO.id == null}">*</span>
                    </label>
                    <input type="password" th:field="*{password}" class="form-control"
                           th:placeholder="${userDTO.id != null} ? 'Leave blank to keep current password' : 'Set a password'"
                           th:required="${userDTO.id == null}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Role <span class="text-danger">*</span></label>
                    <select th:field="*{roleId}" class="form-select" required>
                        <option value="">-- Select Role --</option>
                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"></option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option th:each="s : ${statuses}" th:value="${s.code}" th:text="${s.desc}"></option>
                    </select>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                    <a th:href="@{/users}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
