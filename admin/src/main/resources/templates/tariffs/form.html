<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0" th:text="${tariffDTO.id != null} ? 'Edit Tariff' : 'New Tariff'"></h4>
        <a th:href="@{/tariffs}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to List</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/tariffs/save}" th:object="${tariffDTO}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label class="form-label">Tariff Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Tariff Code</label>
                    <input type="text" th:field="*{code}" class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                </div>

                <div class="col-md-4">
                    <div class="form-check mt-2">
                        <input type="checkbox" th:field="*{isActive}" class="form-check-input" id="isActive">
                        <label class="form-check-label" for="isActive">Active</label>
                    </div>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                    <a th:href="@{/tariffs}" class="btn btn-outline-secondary">Cancel</a>
                    <span class="text-muted small ms-2" th:if="${tariffDTO.id == null}">
                        <i class="bi bi-info-circle"></i> You'll be able to set up rate bands after saving.
                    </span>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
