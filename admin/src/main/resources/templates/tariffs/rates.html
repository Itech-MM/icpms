<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="mb-0" th:text="'Rate Bands: ' + ${tariffDTO.name}"></h4>
            <small class="text-muted" th:text="${tariffDTO.description}"></small>
        </div>
        <a th:href="@{/tariffs}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to Tariffs</a>
    </div>

    <div class="row g-3">
        <div class="col-md-7">
            <div class="card">
                <div class="card-header bg-white">
                    <strong>Existing Rate Bands</strong>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>From (min)</th>
                                    <th>To (min)</th>
                                    <th>Amount</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="rate : ${tariffDTO.rates}">
                                    <td th:text="${rate.fromMinute}"></td>
                                    <td th:text="${rate.toMinute}"></td>
                                    <td th:text="${#numbers.formatDecimal(rate.amount, 1, 2)}"></td>
                                    <td class="text-end">
                                        <form th:action="@{'/tariffs/' + ${tariffDTO.id} + '/rates/' + ${rate.id} + '/delete'}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" data-confirm="Delete this rate band?"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(tariffDTO.rates)}">
                                    <td colspan="4" class="text-center text-muted py-3">No rate bands defined yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-white">
                    <strong>Add Rate Band</strong>
                </div>
                <div class="card-body">
                    <form th:action="@{'/tariffs/' + ${tariffDTO.id} + '/rates/save'}" th:object="${newRate}" method="post" class="row g-3">
                        <div class="col-6">
                            <label class="form-label">From (minute) <span class="text-danger">*</span></label>
                            <input type="number" min="0" th:field="*{fromMinute}" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">To (minute)</label>
                            <input type="number" min="0" th:field="*{toMinute}" class="form-control" placeholder="Leave blank if open-ended">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Amount <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" th:field="*{amount}" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Rate Band</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
