<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Members</h4>
        <a th:href="@{/members/new}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Add Member</a>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/members}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small">Name</label>
                    <input type="text" name="name" class="form-control form-control-sm" th:value="${searchDTO.name}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Phone Number</label>
                    <input type="text" name="phoneNumber" class="form-control form-control-sm" th:value="${searchDTO.phoneNumber}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Status</label>
                    <select name="status" class="form-select form-select-sm">
                        <option value="">-- All --</option>
                        <option th:each="s : ${statuses}" th:value="${s.code}" th:text="${s.desc}"
                                th:selected="${searchDTO.status != null and searchDTO.status == s.code}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary btn-sm w-100"><i class="bi bi-search"></i> Search</button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/members}" class="btn btn-outline-secondary btn-sm w-100">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Membership</th>
                            <th>Reserved Slot</th>
                            <th>Valid Until</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="member : ${result.results}">
                            <td th:text="${member.id}"></td>
                            <td th:text="${member.name}"></td>
                            <td th:text="${member.phoneNumber}"></td>
                            <td th:text="${member.email}"></td>
                            <td>
                                <span th:text="${member.membershipTypeDesc}"></span>
                                <span th:if="${member.isVip}" class="badge bg-warning text-dark ms-1">VIP</span>
                            </td>
                            <td th:text="${member.reservedSlotNumber} ?: '-'"></td>
                            <td th:text="${member.validUntil} ?: '-'"></td>
                            <td>
                                <span class="badge" th:classappend="${member.status == 1} ? 'bg-success' : 'bg-secondary'" th:text="${member.statusDesc}"></span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{'/members/' + ${member.id} + '/edit'}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{'/members/' + ${member.id} + '/delete'}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" data-confirm="Delete this member?"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(result.results)}">
                            <td colspan="9" class="text-center text-muted py-4">No members found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: pager(${result}, ${pageUrlPrefix})}"></div>
        </div>
    </div>

</div>
</body>
</html>
