<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0" th:text="${planId != null} ? 'Edit Member Plan' : 'New Member Plan'"></h4>
        <a th:href="@{/members/plans}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to List</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="${planId != null} ? @{'/members/plans/' + ${planId}} : @{/members/plans}"
                  th:object="${planRequest}" method="post" class="row g-3">

                <div class="col-md-3">
                    <label class="form-label">Code <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{code}" class="form-control" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Price <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
                </div>

                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Duration (days) <span class="text-danger">*</span></label>
                    <input type="number" th:field="*{durationDays}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Granted Balance</label>
                    <input type="number" step="0.01" th:field="*{grantedBalance}" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Discount %</label>
                    <input type="number" step="0.01" th:field="*{discountPercent}" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Free Minutes</label>
                    <input type="number" th:field="*{freeMinutes}" class="form-control">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Max Vehicles</label>
                    <input type="number" th:field="*{maxVehicles}" class="form-control">
                </div>
                <div class="col-md-3">
                    <div class="form-check mt-4">
                        <input type="checkbox" th:field="*{isActive}" class="form-check-input" id="isActive">
                        <label class="form-check-label" for="isActive">Active</label>
                    </div>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                    <a th:href="@{/members/plans}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
