<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0" th:text="${gateDTO.id != null} ? 'Edit Gate' : 'New Gate'"></h4>
        <a th:href="@{/gates}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to List</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/gates/save}" th:object="${gateDTO}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label class="form-label">Site <span class="text-danger">*</span></label>
                    <select th:field="*{siteId}" class="form-select" required>
                        <option value="">-- Select Site --</option>
                        <option th:each="s : ${sites}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Gate Type <span class="text-danger">*</span></label>
                    <select th:field="*{type}" class="form-select" required>
                        <option value="">-- Select Type --</option>
                        <option th:each="t : ${gateTypes}" th:value="${t.code}" th:text="${t.desc}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Gate Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Gate Code</label>
                    <input type="text" th:field="*{code}" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option th:each="s : ${statuses}" th:value="${s.code}" th:text="${s.desc}"></option>
                    </select>
                </div>
                
                 <div class="col-md-6">
                    <label class="form-label">Gate IP Address</label>
                    <input type="text" th:field="*{gateIpAddress}" class="form-control">
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                    <a th:href="@{/gates}" class="btn btn-outline-secondary">Cancel</a>
                    <span class="text-muted small ms-2" th:if="${gateDTO.id == null}">
                        <i class="bi bi-info-circle"></i> You'll be able to add devices (camera, LED, etc.) after saving.
                    </span>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
