<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
	<div layout:fragment="content">

		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="mb-0"
				th:text="${operatorDTO.id != null} ? 'Edit Operator' : 'New Operator'"></h4>
			<a th:href="@{/operators}" class="btn btn-outline-secondary btn-sm"><i
				class="bi bi-arrow-left"></i> Back to List</a>
		</div>

		<div class="card">
			<div class="card-body">
				<form th:action="@{/operators/save}" th:object="${operatorDTO}"
					method="post" class="row g-3" id="operatorForm">
					<input type="hidden" th:field="*{id}">

					<div class="col-md-6">
						<label class="form-label">Full Name <span
							class="text-danger">*</span></label> <input type="text"
							th:field="*{name}" class="form-control" required>
					</div>
					<div class="col-md-6">
					    <label class="form-label">Username <span class="text-danger">*</span></label>
					    <input type="text" th:field="*{username}" class="form-control"
					           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" required>
					    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
					</div>

					<div class="col-md-6">
						<label class="form-label">Phone Number</label> <input type="text"
							th:field="*{phoneNumber}" class="form-control">
					</div>

					<div class="col-md-6" th:if="${operatorDTO.id == null}">
						<label class="form-label">Password <span
							class="text-danger">*</span></label> <input type="password"
							th:field="*{password}" class="form-control"
							placeholder="Set a password" required>
					</div>
					<div class="col-md-6" th:if="${operatorDTO.id == null}">
						<label class="form-label">Quick PIN <span
							class="text-danger">*</span></label>
						<div class="pin-group d-flex gap-2">
							<input type="text" class="form-control text-center pin-digit"
								style="width: 3rem; height: 3rem; font-size: 1.25rem;"
								maxlength="1" inputmode="numeric" pattern="[0-9]*"
								autocomplete="off"> <input type="text"
								class="form-control text-center pin-digit"
								style="width: 3rem; height: 3rem; font-size: 1.25rem;"
								maxlength="1" inputmode="numeric" pattern="[0-9]*"
								autocomplete="off"> <input type="text"
								class="form-control text-center pin-digit"
								style="width: 3rem; height: 3rem; font-size: 1.25rem;"
								maxlength="1" inputmode="numeric" pattern="[0-9]*"
								autocomplete="off"> <input type="text"
								class="form-control text-center pin-digit"
								style="width: 3rem; height: 3rem; font-size: 1.25rem;"
								maxlength="1" inputmode="numeric" pattern="[0-9]*"
								autocomplete="off"> <input type="text"
								class="form-control text-center pin-digit"
								style="width: 3rem; height: 3rem; font-size: 1.25rem;"
								maxlength="1" inputmode="numeric" pattern="[0-9]*"
								autocomplete="off"> <input type="text"
								class="form-control text-center pin-digit"
								style="width: 3rem; height: 3rem; font-size: 1.25rem;"
								maxlength="1" inputmode="numeric" pattern="[0-9]*"
								autocomplete="off"> <input type="hidden"
								th:field="*{pinPassword}" class="pin-hidden-input">
						</div>
						<div class="text-danger small mt-1"
							th:if="${#fields.hasErrors('pinPassword')}"
							th:errors="*{pinPassword}"></div>
						<div class="form-text">Used for PIN login on the operator
							terminal.</div>
					</div>

					<div class="col-md-4">
						<label class="form-label">Assigned Site</label> <select
							th:field="*{siteId}" class="form-select">
							<option value="">-- Not assigned --</option>
							<option th:each="s : ${sites}" th:value="${s.id}"
								th:text="${s.name}"></option>
						</select>
					</div>
					<div class="col-md-4">
						<label class="form-label">Role <span class="text-danger">*</span></label>
						<select th:field="*{role}" class="form-select" required>
							<option value="">-- Select Role --</option>
							<option th:each="r : ${operatorRoles}" th:value="${r.code}"
								th:text="${r.desc}"></option>
						</select>
					</div>
					<div class="col-md-4">
						<label class="form-label">Status</label> <select
							th:field="*{status}" class="form-select">
							<option th:each="s : ${statuses}" th:value="${s.code}"
								th:text="${s.desc}"></option>
						</select>
					</div>

					<div class="col-12" th:if="${operatorDTO.id != null}">
						<hr>
						<h6 class="mb-3">Login Credentials</h6>
						<div class="row g-3 align-items-end">
							<div class="col-md-4">
								<label class="form-label text-muted">Password</label>
								<div class="d-flex gap-2">
									<input type="text" class="form-control" value="••••••••"
										readonly disabled>
									<button type="button"
										class="btn btn-outline-primary text-nowrap"
										data-bs-toggle="modal" data-bs-target="#changePasswordModal">
										<i class="bi bi-key"></i> Change
									</button>
								</div>
							</div>
							<div class="col-md-4">
							    <label class="form-label text-muted">Quick PIN</label>
							    <div class="d-flex gap-2">
							        <input type="text" class="form-control" value="••••••" readonly disabled>
							        <button type="button" class="btn btn-outline-primary text-nowrap" data-bs-toggle="modal" data-bs-target="#changePinModal">
							            <i class="bi bi-key"></i> Change
							        </button>
							    </div>
							</div>
							<div class="col-md-4">
								<label class="form-label text-muted">RFID Token</label>
								<div class="input-group">
									<input type="text" class="form-control" id="rfidTokenField"
										th:value="${operatorDTO.rfidToken}" readonly disabled>
									<button type="button"
										class="btn btn-outline-secondary copy-btn"
										data-copy-target="rfidTokenField" title="Copy RFID Token">
										<i class="bi bi-clipboard"></i>
									</button>
								</div>
							</div>
							<div class="col-md-4">
								<label class="form-label text-muted">Swipe Card Token</label>
								<div class="input-group">
									<input type="text" class="form-control" id="stripeTokenField"
										th:value="${operatorDTO.stripeToken}" readonly disabled>
									<button type="button"
										class="btn btn-outline-secondary copy-btn"
										data-copy-target="stripeTokenField"
										title="Copy Swipe Card Token">
										<i class="bi bi-clipboard"></i>
									</button>
								</div>
							</div>
							<div class="col-md-4" th:if="${operatorDTO.qrImagePath != null}">
								<label class="form-label text-muted d-block">QR Code</label> <img
									th:src="${operatorDTO.qrImagePath}" alt="Operator QR Code"
									data-bs-toggle="modal" data-bs-target="#qrCodeModal"
									style="width: 120px; height: 120px; object-fit: contain; border: 1px solid #dee2e6; border-radius: 4px; padding: 4px; cursor: pointer;">
							</div>
						</div>
					</div>

					<div class="col-12 mt-4">
						<button type="submit" class="btn btn-primary">
							<i class="bi bi-check-lg"></i> Save
						</button>
						<a th:href="@{/operators}" class="btn btn-outline-secondary">Cancel</a>
					</div>
				</form>
			</div>
		</div>

		<div class="modal fade" id="changePasswordModal" tabindex="-1"
			th:if="${operatorDTO.id != null}">
			<div class="modal-dialog">
				<form
					th:action="@{/operators/{id}/change-password(id=${operatorDTO.id})}"
					method="post" class="modal-content" id="changePasswordForm">
					<div class="modal-header">
						<h5 class="modal-title">Change Password</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<div class="mb-3">
							<label class="form-label">New Password <span
								class="text-danger">*</span></label>
							<div class="input-group">
								<input type="password" name="newPassword" id="newPasswordField"
									class="form-control" required minlength="4">
								<button type="button"
									class="btn btn-outline-secondary toggle-visibility-btn"
									data-target="newPasswordField">
									<i class="bi bi-eye"></i>
								</button>
							</div>
						</div>
						<div class="mb-3">
							<label class="form-label">Confirm Password <span
								class="text-danger">*</span></label>
							<div class="input-group">
								<input type="password" name="confirmPassword"
									id="confirmPasswordField" class="form-control" required
									minlength="4">
								<button type="button"
									class="btn btn-outline-secondary toggle-visibility-btn"
									data-target="confirmPasswordField">
									<i class="bi bi-eye"></i>
								</button>
							</div>
						</div>
						<div class="invalid-feedback d-block" id="passwordMismatchWarning"
							style="display: none !important;">Passwords do not match.</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-outline-secondary"
							data-bs-dismiss="modal">Cancel</button>
						<button type="submit" class="btn btn-primary">Save
							Password</button>
					</div>
				</form>
			</div>
		</div>

		<div class="modal fade" id="changePinModal" tabindex="-1"
			th:if="${operatorDTO.id != null}">
			<div class="modal-dialog">
				<form
					th:action="@{/operators/{id}/change-pin(id=${operatorDTO.id})}"
					method="post" class="modal-content" id="changePinForm">
					<div class="modal-header">
						<h5 class="modal-title">Change Quick PIN</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">
						<div class="mb-3">
							<label class="form-label">New PIN <span
								class="text-danger">*</span></label>
							<div class="pin-group d-flex gap-2">
								<input type="text" class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="text"
									class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="text"
									class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="text"
									class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="text"
									class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="text"
									class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="hidden" name="newPin"
									class="pin-hidden-input">
							</div>
						</div>
						<div class="mb-3">
							<label class="form-label">Confirm PIN <span
								class="text-danger">*</span></label>
							<div class="pin-group d-flex gap-2">
								<input type="text" class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="text"
									class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="text"
									class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="text"
									class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="text"
									class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="text"
									class="form-control text-center pin-digit"
									style="width: 3rem; height: 3rem; font-size: 1.25rem;"
									maxlength="1" inputmode="numeric" pattern="[0-9]*"
									autocomplete="off"> <input type="hidden"
									name="confirmPin" class="pin-hidden-input">
							</div>
						</div>
						<div class="invalid-feedback d-block" id="pinMismatchWarning"
							style="display: none !important;">PINs do not match or are
							not 6 digits.</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-outline-secondary"
							data-bs-dismiss="modal">Cancel</button>
						<button type="submit" class="btn btn-primary">Save PIN</button>
					</div>
				</form>
			</div>
		</div>

		<div class="modal fade" id="qrCodeModal" tabindex="-1"
			th:if="${operatorDTO.id != null and operatorDTO.qrImagePath != null}">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title">Operator QR Code</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body text-center">
						<img th:src="${operatorDTO.qrImagePath}" alt="Operator QR Code"
							id="qrModalImage"
							style="width: 260px; height: 260px; object-fit: contain; border: 1px solid #dee2e6; border-radius: 4px; padding: 8px;">
						<div class="mt-2 text-muted" th:text="${operatorDTO.name}"></div>
					</div>
					<div class="modal-footer">
						<a th:href="${operatorDTO.qrImagePath}"
							th:attr="download=${'operator-qr-' + operatorDTO.username + '.png'}"
							class="btn btn-primary" target="_blank"> <i
							class="bi bi-download"></i> Download QR Code
						</a>
						<button type="button" class="btn btn-outline-secondary"
							data-bs-dismiss="modal">Close</button>
					</div>
				</div>
			</div>
		</div>

		<div layout:fragment="scripts">
			<script th:inline="javascript">
        function setupPinGroup(group) {
        	var digits = Array.from(group.querySelectorAll('.pin-digit'));
            var hidden = group.querySelector('.pin-hidden-input');

            function syncHidden() {
                hidden.value = digits.map(function (d) { return d.value; }).join('');
            }

            if (hidden.value) {
                hidden.value.split('').forEach(function (ch, i) {
                    if (digits[i]) digits[i].value = ch;
                });
            }

            digits.forEach(function (digit, index) {
                digit.addEventListener('input', function () {
                    digit.value = digit.value.replace(/[^0-9]/g, '').slice(0, 1);
                    if (digit.value && index < digits.length - 1) {
                        digits[index + 1].focus();
                    }
                    syncHidden();
                });

                digit.addEventListener('keydown', function (e) {
                    if (e.key === 'Backspace' && !digit.value && index > 0) {
                        digits[index - 1].focus();
                    }
                    if (e.key === 'ArrowLeft' && index > 0) {
                        digits[index - 1].focus();
                    }
                    if (e.key === 'ArrowRight' && index < digits.length - 1) {
                        digits[index + 1].focus();
                    }
                });

                digit.addEventListener('paste', function (e) {
                    e.preventDefault();
                    var pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                    if (!pasted) {
                        return;
                    }
                    digits.forEach(function (d, i) {
                        d.value = pasted[i] || '';
                    });
                    var nextIndex = Math.min(pasted.length, digits.length) - 1;
                    if (nextIndex >= 0) {
                        digits[nextIndex].focus();
                    }
                    syncHidden();
                });
            });

            syncHidden();
        }

        document.querySelectorAll('.pin-group').forEach(function (group) {
            setupPinGroup(group);
        });

        document.getElementById('operatorForm')?.addEventListener('submit', function (e) {
            var pinHidden = this.querySelector('#pinPassword');
            if (pinHidden && pinHidden.value.length !== 6) {
                e.preventDefault();
                showWarning('PIN must be exactly 6 digits.');
            }
        });

        document.getElementById('changePasswordForm')?.addEventListener('submit', function (e) {
            var pw = this.querySelector('[name="newPassword"]').value;
            var confirm = this.querySelector('[name="confirmPassword"]').value;
            var warning = document.getElementById('passwordMismatchWarning');
            if (pw !== confirm) {
                e.preventDefault();
                warning.style.display = 'block';
            } else {
                warning.style.display = 'none';
            }
        });

        document.getElementById('changePinForm')?.addEventListener('submit', function (e) {
            var newPin = this.querySelector('[name="newPin"]').value;
            var confirmPin = this.querySelector('[name="confirmPin"]').value;
            var warning = document.getElementById('pinMismatchWarning');
            if (newPin.length !== 6 || confirmPin.length !== 6 || newPin !== confirmPin) {
                e.preventDefault();
                warning.style.display = 'block';
            } else {
                warning.style.display = 'none';
            }
        });

        document.querySelectorAll('.copy-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var target = document.getElementById(btn.getAttribute('data-copy-target'));
                if (!target || !target.value) {
                    return;
                }
                navigator.clipboard.writeText(target.value).then(function () {
                    var icon = btn.querySelector('i');
                    icon.classList.remove('bi-clipboard');
                    icon.classList.add('bi-clipboard-check');
                    btn.classList.add('btn-success');
                    btn.classList.remove('btn-outline-secondary');
                    setTimeout(function () {
                        icon.classList.remove('bi-clipboard-check');
                        icon.classList.add('bi-clipboard');
                        btn.classList.remove('btn-success');
                        btn.classList.add('btn-outline-secondary');
                    }, 1200);
                });
            });
        });

        document.querySelectorAll('.toggle-visibility-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var target = document.getElementById(btn.getAttribute('data-target'));
                var icon = btn.querySelector('i');
                if (!target) {
                    return;
                }
                var isPassword = target.getAttribute('type') === 'password';
                if (isPassword) {
                    target.setAttribute('type', 'text');
                    icon.classList.remove('bi-eye');
                    icon.classList.add('bi-eye-slash');
                } else {
                    target.setAttribute('type', 'password');
                    icon.classList.remove('bi-eye-slash');
                    icon.classList.add('bi-eye');
                }
            });
        });
    </script>	
		</div>

	</div>
</body>
</html>
