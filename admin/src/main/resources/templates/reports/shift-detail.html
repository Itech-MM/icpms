<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <style>
        .sd {
            --sd-line: var(--steel-700);
            --sd-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }
        .sd-header {
            display: flex;
            align-items: stretch;
            background: var(--steel-900);
            color: #fff;
            border-left: 8px solid var(--info-light);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .sd-header-main {
            padding: 1rem 1.25rem;
            flex: 1;
        }
        .sd-eyebrow {
            font-size: .7rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--steel-300);
            font-weight: 600;
        }
        .sd-title {
            font-family: var(--sd-mono);
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: .02em;
            color: #fff;
        }
        .sd-header-status {
            display: flex;
            align-items: center;
        }
        .sd-status {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            font-size: .72rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            font-weight: 700;
            cursor: default;
            user-select: none;
        }
        .sd-status-dot {
            width: .6rem;
            height: .6rem;
            border-radius: 50%;
            background: currentColor;
        }
        .sd-status.on { color: var(--success-light); }
        .sd-status.off { color: var(--steel-300); }
        .sd-header-side {
            display: flex;
            align-items: stretch;
            background: var(--steel-800);
            padding: 0;
        }
        .sd-back {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            color: var(--steel-200);
            text-decoration: none;
            font-size: .72rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-weight: 600;
            transition: background-color .15s ease, color .15s ease;
        }
        .sd-back:hover {
            background: var(--steel-700);
            color: #fff;
        }

        .sd-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border: 2px solid var(--sd-line);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .sd-cell {
            padding: .8rem 1rem;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            min-width: 0;
        }
        .sd-cell:nth-child(4n) { border-right: 0; }
        .sd-cell.wide {
            grid-column: span 4;
            border-right: 0;
            border-bottom: 0;
        }
        .sd-label {
            font-size: .65rem;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: .25rem;
        }
        .sd-value {
            font-size: .95rem;
            font-weight: 600;
            color: var(--text);
            word-break: break-word;
        }
        .sd-value.num {
            font-family: var(--sd-mono);
            font-size: 1.1rem;
        }
        .sd-value.pos { color: var(--success); }
        .sd-value.neg { color: var(--danger); }
        .sd-sub {
            font-family: var(--sd-mono);
            font-size: .75rem;
            color: var(--text-muted);
        }

        .sd-section {
            border: 2px solid var(--sd-line);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .sd-section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .65rem 1rem;
            background: var(--steel-900);
            color: #fff;
        }
        .sd-section-title {
            font-size: .78rem;
            letter-spacing: .16em;
            text-transform: uppercase;
            font-weight: 600;
            margin: 0;
            color: #fff;
        }
        .sd-section-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .sd-total {
            display: inline-flex;
            align-items: baseline;
            gap: .6rem;
        }
        .sd-total-label {
            font-size: .68rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--steel-300);
            font-weight: 600;
        }
        .sd-total-value {
            font-family: var(--sd-mono);
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
        }
        .sd-count {
            font-family: var(--sd-mono);
            font-size: .8rem;
            background: var(--brand);
            color: var(--on-brand);
            border-radius: var(--radius-sm);
            padding: .15rem .6rem;
            font-weight: 700;
        }
        .sd-table { margin: 0; }
        .sd-table thead th {
            background: var(--steel-100);
            color: var(--steel-700);
            font-size: .68rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-weight: 600;
            border-bottom: 2px solid var(--sd-line);
            white-space: nowrap;
        }
        .sd-table tbody td {
            font-size: .85rem;
            color: var(--text);
            border-color: var(--border-soft);
        }
        .sd-table .mono { font-family: var(--sd-mono); }
        .sd-plate {
            display: inline-block;
            font-family: var(--sd-mono);
            font-weight: 700;
            letter-spacing: .06em;
            color: var(--text);
            border: 2px solid var(--steel-800);
            border-radius: var(--radius-sm);
            padding: .05rem .5rem;
            background: var(--surface);
        }
        .sd-tag {
            display: inline-block;
            font-size: .68rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            font-weight: 600;
            padding: .15rem .5rem;
            border-radius: var(--radius-sm);
            background: var(--steel-800);
            color: #fff;
        }
        .sd-pager {
            padding: .75rem 1rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 991.98px) {
            .sd-grid { grid-template-columns: repeat(2, 1fr); }
            .sd-cell:nth-child(4n) { border-right: 1px solid var(--border); }
            .sd-cell:nth-child(2n) { border-right: 0; }
            .sd-cell.wide { grid-column: span 2; }
        }
    </style>

    <div class="sd">

        <div class="sd-header">
            <div class="sd-header-main">
                <div class="sd-eyebrow">Shift Report / Detail</div>
                <div class="d-flex align-items-center">
                    <h4 class="sd-title" th:text="${shift.code}"></h4>
                    <div class="sd-header-status ms-3">
                        <span class="sd-status" th:classappend="${shift.shiftStatus == 1} ? 'on' : 'off'">
                            <span class="sd-status-dot"></span>
                            <span th:text="${shift.shiftStatusDesc}"></span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="sd-header-side">
                <a class="sd-back" th:href="@{/reports/shifts}"><i class="bi bi-arrow-left"></i> Back to Shift Report</a>
            </div>
        </div>

        <div class="sd-grid">
            <div class="sd-cell">
                <div class="sd-label">Operator</div>
                <div class="sd-value" th:text="${shift.operator != null} ? ${shift.operator.name} : '-'"></div>
            </div>
            <div class="sd-cell">
                <div class="sd-label">Gate</div>
                <div class="sd-value" th:text="${shift.gate != null} ? ${shift.gate.name} : '-'"></div>
                <div class="sd-sub" th:if="${shift.gateIpAddress != null}" th:text="${shift.gateIpAddress}"></div>
            </div>
            <div class="sd-cell">
                <div class="sd-label">Start Time</div>
                <div class="sd-value num" th:text="${shift.startDateTime != null} ? ${shift.startDateTime} : '-'"></div>
            </div>
            <div class="sd-cell">
                <div class="sd-label">End Time</div>
                <div class="sd-value num" th:text="${shift.endDateTime != null} ? ${shift.endDateTime} : '-'"></div>
            </div>
            <div class="sd-cell">
                <div class="sd-label">Opening Cash</div>
                <div class="sd-value num" th:text="${shift.openingCashDesc}"></div>
            </div>
            <div class="sd-cell">
                <div class="sd-label">Closing Cash</div>
                <div class="sd-value num" th:text="${shift.closingCashDesc}"></div>
            </div>
            <div class="sd-cell">
                <div class="sd-label">Difference</div>
                <div class="sd-value num"
                     th:classappend="${shift.diff.signum() < 0} ? 'neg' : (${shift.diff.signum() > 0} ? 'pos' : '')"
                     th:text="${shift.diffDesc}"></div>
            </div>
            <div class="sd-cell">
                <div class="sd-label">Sessions</div>
                <div class="sd-value num" th:text="${result.totalRecords}"></div>
            </div>
            <div class="sd-cell wide">
                <div class="sd-label">Remark</div>
                <div class="sd-value" th:text="${#strings.isEmpty(shift.remark)} ? '-' : ${shift.remark}"></div>
            </div>
        </div>

        <div class="sd-section">
            <div class="sd-section-head">
                <h5 class="sd-section-title">Parking Sessions</h5>
                <div class="sd-section-meta">
                    <span class="sd-total">
                        <span class="sd-total-label">Total Revenue</span>
                        <span class="sd-total-value" th:text="${shift.totalRevenueDesc}"></span>
                    </span>
                    <span class="sd-count" th:text="${result.totalRecords}"></span>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-sm align-middle sd-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Plate No.</th>
                            <th>Site</th>
                            <th>Entry Gate</th>
                            <th>Exit Gate</th>
                            <th>Slot</th>
                            <th>Entry Time</th>
                            <th>Exit Time</th>
                            <th class="text-end">Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${result.results}">
                            <td class="mono" th:text="${s.id}"></td>
                            <td><span class="sd-plate" th:text="${s.plateNumber}"></span></td>
                            <td th:text="${s.siteName}"></td>
                            <td th:text="${s.entryGateName}"></td>
                            <td th:text="${s.exitGateName != null} ? ${s.exitGateName} : '-'"></td>
                            <td class="mono" th:text="${s.parkingSlotNumber != null} ? ${s.parkingSlotNumber} : '-'"></td>
                            <td class="mono" th:text="${s.entryTime}"></td>
                            <td class="mono" th:text="${s.exitTime != null} ? ${s.exitTime} : '-'"></td>
                            <td class="mono text-end"
                                th:text="${s.totalAmount != null} ? ${#numbers.formatDecimal(s.totalAmount, 1, 2)} : '-'"></td>
                            <td><span class="sd-tag" th:text="${s.statusDesc}"></span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(result.results)}">
                            <td colspan="10" class="text-center text-muted py-4">No parking sessions found for this shift.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="sd-pager">
                <div th:replace="~{fragments/pagination :: pager(${result}, ${pageUrlPrefix})}"></div>
            </div>
        </div>

    </div>

</div>
</body>
</html>
