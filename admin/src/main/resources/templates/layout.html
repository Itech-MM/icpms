<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title
	th:text="${pageTitle} != null ? ${pageTitle} + ' | ICPMS Admin' : 'ICPMS Admin'">ICPMS
	Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
	href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
	rel="stylesheet">

<link th:href="@{/plugins/bootstrap/css/bootstrap.min.css}"
	rel="stylesheet">
<link rel="stylesheet"
	th:href="@{/plugins/bootstrap/icon/bootstrap-icons.min.css}">
<link rel="stylesheet"
	th:href="@{/plugins/jquery/confirm/jquery-confirm.min.css}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

	<div class="d-flex" id="wrapper">

		<nav class="sidebar" id="sidebar">
			<div class="sidebar-brand">
				<i class="bi bi-p-circle-fill"></i> <span>ICPMS Admin</span>
				<button type="button"
					class="btn-close btn-close-white ms-auto d-lg-none"
					id="sidebarClose" aria-label="Close"></button>
			</div>

			<ul class="nav flex-column">
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'dashboard'} ? 'active'"
					th:href="@{/}"> <i class="bi bi-speedometer2"></i> Dashboard
				</a></li>

				<li class="nav-heading">Master Setup</li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'sites'} ? 'active'"
					th:href="@{/sites}"> <i class="bi bi-buildings"></i> Sites
				</a></li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'gates'} ? 'active'"
					th:href="@{/gates}"> <i class="bi bi-sign-turn-right"></i>
						Gates
				</a></li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'slots'} ? 'active'"
					th:href="@{/parking-slots}"> <i class="bi bi-grid-3x3-gap"></i>
						Parking Slots
				</a></li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'tariffs'} ? 'active'"
					th:href="@{/tariffs}"> <i class="bi bi-cash-coin"></i> Tariffs
				</a></li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'members'} ? 'active'"
					th:href="@{/members}"> <i class="bi bi-person-badge"></i>
						Members
				</a></li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'vehicles'} ? 'active'"
					th:href="@{/vehicles}"> <i class="bi bi-car-front"></i>
						Vehicles
				</a></li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'operators'} ? 'active'"
					th:href="@{/operators}"> <i class="bi bi-person-workspace"></i>
						Operators
				</a></li>

				<li class="nav-heading">Reports</li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'report-sessions'} ? 'active'"
					th:href="@{/reports/parking-sessions}"> <i
						class="bi bi-file-earmark-bar-graph"></i> Parking Sessions
				</a></li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'report-payments'} ? 'active'"
					th:href="@{/reports/payments}"> <i class="bi bi-receipt"></i>
						Payments
				</a></li>

				<li class="nav-heading">Administration</li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'users'} ? 'active'"
					th:href="@{/users}"> <i class="bi bi-people"></i> Users
				</a></li>
				<li class="nav-item"><a class="nav-link"
					th:classappend="${activeMenu == 'roles'} ? 'active'"
					th:href="@{/roles}"> <i class="bi bi-shield-lock"></i> Roles
				</a></li>
			</ul>
		</nav>

		<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

		<div id="page-content-wrapper" class="flex-grow-1">

			<nav class="navbar navbar-expand top-navbar">
				<div class="container-fluid">
					<button class="btn sidebar-toggle d-lg-none" id="sidebarToggle"
						type="button">
						<i class="bi bi-list"></i>
					</button>
					<span class="navbar-text ms-2 fw-semibold" th:text="${pageTitle}">Page
						Title</span>

					<div class="ms-auto d-flex align-items-center gap-2">
						<!-- <span class="user-avatar" sec:authentication="name">A</span> -->
						<span class="text-muted d-none d-sm-inline"
							sec:authentication="name">Admin</span>
						<form th:action="@{/logout}" method="post" class="d-inline">
							<button type="submit" class="btn btn-sm btn-outline-danger"
								data-confirm="Are you sure you want to logout?">
								<i class="bi bi-box-arrow-right"></i>
							</button>
						</form>
					</div>
				</div>
			</nav>

			<div class="content-area">
				<div layout:fragment="content"></div>
			</div>
		</div>
	</div>

	<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
	<script th:src="@{/plugins/jquery/confirm/jquery-confirm.min.js}"></script>
	<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>

	<script th:inline="javascript">
		/*<![CDATA[*/
		var flashSuccessMsg = /*[[${successMsg}]]*/null;
		var flashErrorMsg = /*[[${errorMsg}]]*/null;
		/*]]>*/
	</script>

	<script th:src="@{/js/app.js}"></script>

</body>
</html>
