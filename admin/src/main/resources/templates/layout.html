<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />
<title
	th:text="${pageTitle} != null ? ${pageTitle} + ' | ICPMS Admin' : 'ICPMS Admin'">ICPMS
	Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" th:href="@{/images/logo/logo.png}">

<link th:href="@{/plugins/bootstrap/css/bootstrap.min.css}"
	rel="stylesheet">
<link rel="stylesheet"
	th:href="@{/plugins/bootstrap/icon/bootstrap-icons.min.css}">
<link rel="stylesheet"
	th:href="@{/plugins/jquery/confirm/jquery-confirm.min.css}">
<link rel="stylesheet" th:href="@{/css/app.css}">
<link rel="stylesheet" th:href="@{/css/compact.css}">
<link rel="stylesheet" th:href="@{/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/css/medium-contrast.css}">
<link rel="stylesheet" th:href="@{/css/toast.css}">
</head>
<body>

	<div class="d-flex" id="wrapper">

		<div th:replace="~{fragments/sidebar :: sidebar}"></div>

		<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

		<div id="page-content-wrapper" class="flex-grow-1">

			<nav class="navbar navbar-expand top-navbar">
				<div class="container-fluid">
					<button class="btn sidebar-toggle d-lg-none" id="sidebarToggle"
						type="button">
						<i class="bi bi-list"></i>
					</button>
					<span class="navbar-text ms-2 fw-semibold" th:text="${pageTitle}">Page
						Title</span>

					<div class="ms-auto d-flex align-items-center gap-2">
						<span class="text-muted d-none d-sm-inline"
							sec:authentication="name">Admin</span>
						<form th:action="@{/logout}" method="post" class="d-inline">
							<button type="submit" class="btn btn-sm btn-outline-danger"
								data-confirm="Are you sure you want to logout?">
								<i class="bi bi-box-arrow-right"></i>
							</button>
						</form>
					</div>
				</div>
			</nav>

			<div class="content-area">
				<div layout:fragment="content"></div>
			</div>
		</div>
	</div>

	<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
	<script th:src="@{/plugins/jquery/confirm/jquery-confirm.min.js}"></script>
	<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>

	<script th:inline="javascript">
		/*<![CDATA[*/
		var flashSuccessMsg = /*[[${successMsg}]]*/null;
		var flashErrorMsg = /*[[${errorMsg}]]*/null;
		/*]]>*/
	</script>

	<script th:src="@{/js/app.js}"></script>
	<div layout:fragment="scripts"></div>

</body>
</html>
