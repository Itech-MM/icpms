<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0" th:text="${siteDTO.id != null} ? 'Edit Site' : 'New Site'"></h4>
        <a th:href="@{/sites}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to List</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/sites/save}" th:object="${siteDTO}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label class="form-label">Site Name <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Site Code <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{code}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Address</label>
                    <input type="text" th:field="*{address}" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Total Capacity <span class="text-danger">*</span></label>
                    <input type="number" min="0" th:field="*{totalCapacity}" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option th:each="s : ${statuses}" th:value="${s.code}" th:text="${s.desc}"></option>
                    </select>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                    <a th:href="@{/sites}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
