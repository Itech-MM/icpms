<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <h4 class="mb-4">Dashboard Overview</h4>

    <div class="row g-3 mb-4">
        <div class="col-md-3 col-sm-6">
            <div class="stat-card d-flex justify-content-between align-items-center" style="background-color:#0d6efd;">
                <div>
                    <div class="stat-value" th:text="${stats.totalSites}">0</div>
                    <div>Total Sites</div>
                </div>
                <i class="bi bi-buildings stat-icon"></i>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="stat-card d-flex justify-content-between align-items-center" style="background-color:#198754;">
                <div>
                    <div class="stat-value" th:text="${stats.availableSlots} + ' / ' + ${stats.totalSlots}">0</div>
                    <div>Available Slots</div>
                </div>
                <i class="bi bi-grid-3x3-gap stat-icon"></i>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="stat-card d-flex justify-content-between align-items-center" style="background-color:#fd7e14;">
                <div>
                    <div class="stat-value" th:text="${stats.activeSessions}">0</div>
                    <div>Active Sessions</div>
                </div>
                <i class="bi bi-car-front-fill stat-icon"></i>
            </div>
        </div>
        <div class="col-md-3 col-sm-6">
            <div class="stat-card d-flex justify-content-between align-items-center" style="background-color:#6f42c1;">
                <div>
                    <div class="stat-value">RM <span th:text="${#numbers.formatDecimal(stats.todayRevenue, 1, 2)}">0.00</span></div>
                    <div>Today's Revenue</div>
                </div>
                <i class="bi bi-cash-stack stat-icon"></i>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-4 col-sm-6">
            <div class="card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Gates</div>
                        <div class="fs-4 fw-bold" th:text="${stats.totalGates}">0</div>
                    </div>
                    <i class="bi bi-sign-turn-right fs-1 text-primary opacity-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-sm-6">
            <div class="card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Occupied Slots</div>
                        <div class="fs-4 fw-bold" th:text="${stats.occupiedSlots}">0</div>
                    </div>
                    <i class="bi bi-p-square fs-1 text-danger opacity-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-sm-6">
            <div class="card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Registered Members</div>
                        <div class="fs-4 fw-bold" th:text="${stats.totalMembers}">0</div>
                    </div>
                    <i class="bi bi-person-badge fs-1 text-success opacity-50"></i>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-sm-6">
            <div class="card">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Registered Vehicles</div>
                        <div class="fs-4 fw-bold" th:text="${stats.totalVehicles}">0</div>
                    </div>
                    <i class="bi bi-car-front fs-1 text-warning opacity-50"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-title mb-3">Quick Links</h6>
                    <a th:href="@{/reports/parking-sessions}" class="btn btn-outline-primary btn-sm me-2">
                        <i class="bi bi-file-earmark-bar-graph"></i> Parking Session Report
                    </a>
                    <a th:href="@{/reports/payments}" class="btn btn-outline-primary btn-sm me-2">
                        <i class="bi bi-receipt"></i> Payment Report
                    </a>
                    <a th:href="@{/sites}" class="btn btn-outline-secondary btn-sm me-2">
                        <i class="bi bi-buildings"></i> Manage Sites
                    </a>
                    <a th:href="@{/tariffs}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-cash-coin"></i> Manage Tariffs
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
