<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0" th:text="${vehicleDTO.id != null} ? 'Edit Vehicle' : 'New Vehicle'"></h4>
        <a th:href="@{/vehicles}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to List</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/vehicles/save}" th:object="${vehicleDTO}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">

                <div class="col-md-6">
                    <label class="form-label">Plate Number <span class="text-danger">*</span></label>
                    <input type="text" th:field="*{plateNumber}" class="form-control text-uppercase" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Vehicle Type</label>
                    <select th:field="*{vehicleType}" class="form-select">
                        <option value="">-- Select --</option>
                        <option value="Car">Car</option>
                        <option value="Motorcycle">Motorcycle</option>
                        <option value="Van">Van</option>
                        <option value="Lorry">Lorry</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Owner (Member)</label>
                    <select th:field="*{memberId}" class="form-select">
                        <option value="">-- Not linked to a member --</option>
                        <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name} + ' (' + ${m.phoneNumber} + ')'"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option th:each="s : ${statuses}" th:value="${s.code}" th:text="${s.desc}"></option>
                    </select>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                    <a th:href="@{/vehicles}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
