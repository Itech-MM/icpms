<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Parking Areas</h4>
        <a th:href="@{/parking-areas/new}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Add Parking Area</a>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/parking-areas}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small">Name</label>
                    <input type="text" name="name" class="form-control form-control-sm" th:value="${searchDTO.name}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Gate</label>
                    <select name="gateId" class="form-select form-select-sm">
                        <option value="">-- All Gates --</option>
                        <option th:each="g : ${gates}" th:value="${g.id}" th:text="${g.name}"
                                th:selected="${searchDTO.gateId != null and searchDTO.gateId == g.id}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Status</label>
                    <select name="status" class="form-select form-select-sm">
                        <option value="">-- All --</option>
                        <option th:each="s : ${statuses}" th:value="${s.code}" th:text="${s.desc}"
                                th:selected="${searchDTO.status != null and searchDTO.status == s.code}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary btn-sm w-100"><i class="bi bi-search"></i> Search</button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/parking-areas}" class="btn btn-outline-secondary btn-sm w-100">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Total / VIP</th>
                            <th>Available (Total / VIP)</th>
                            <th>Slot Tracking</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="area : ${result.results}">
                            <td th:text="${area.id}"></td>
                            <td th:text="${area.name}"></td>
                            <td th:text="${area.totalSlot} + ' / ' + ${area.vipSlot}"></td>
                            <td th:text="${area.availableTotalSlot} + ' / ' + ${area.availableTotalVipSlot}"></td>
                            <td>
                                <span class="badge" th:classappend="${area.slotTrackingEnabled} ? 'bg-info' : 'bg-secondary'"
                                      th:text="${area.slotTrackingEnabled} ? 'Enabled' : 'Disabled'"></span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${area.status == 1} ? 'bg-success' : 'bg-secondary'" th:text="${area.status == 1} ? 'Active' : 'Inactive'"></span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{'/parking-areas/' + ${area.id} + '/edit'}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{'/parking-areas/' + ${area.id} + '/delete'}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" data-confirm="Delete this parking area?"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(result.results)}">
                            <td colspan="8" class="text-center text-muted py-4">No parking areas found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: pager(${result}, ${pageUrlPrefix})}"></div>
        </div>
    </div>

</div>
</body>
</html>
