<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
	<div layout:fragment="content">

		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="mb-0"
				th:text="${parkingAreaDTO.id != null} ? 'Edit Parking Area' : 'New Parking Area'"></h4>
			<a th:href="@{/parking-areas}"
				class="btn btn-outline-secondary btn-sm"><i
				class="bi bi-arrow-left"></i> Back to List</a>
		</div>

		<div class="card">
			<div class="card-body">
				<form th:action="@{/parking-areas/save}"
					th:object="${parkingAreaDTO}" method="post" class="row g-3">
					<input type="hidden" th:field="*{id}">

					<!-- <div class="col-md-6">
                    <label class="form-label">Gate</label>
                    <select th:field="*{gateId}" class="form-select">
                        <option value="-1">-- Select Gate --</option>
                        <option th:each="g : ${gates}" th:value="${g.id}" th:text="${g.name}"></option>
                    </select>
                </div> -->
					<div class="col-md-6">
						<label class="form-label">Area Name <span
							class="text-danger">*</span></label> <input type="text"
							th:field="*{name}" class="form-control" required>
					</div>

					<div class="col-md-6">
						<label class="form-label">Tariff </label> <select
							th:field="*{tariffId}" class="form-select">
							<option value="-1">-- Select tariff --</option>
							<option th:each="s : ${tariffList}" th:value="${s.id}"
								th:text="${s.name}"></option>
						</select>
					</div>

					<div class="col-md-12">
						<label class="form-label">Remark</label> <input type="text"
							th:field="*{remark}" class="form-control">
					</div>

					<div class="col-md-3">
						<label class="form-label">Total Slots <span
							class="text-danger">*</span></label> <input type="number" min="0"
							th:field="*{totalSlot}" class="form-control" required>
					</div>
					<div class="col-md-3">
						<label class="form-label">VIP Slots</label> <input type="number"
							min="0" th:field="*{vipSlot}" class="form-control">
					</div>
					<div class="col-md-3">
						<label class="form-label">Available Total</label> <input
							type="number" min="0" th:field="*{availableTotalSlot}"
							class="form-control">
					</div>
					<div class="col-md-3">
						<label class="form-label">Available VIP</label> <input
							type="number" min="0" th:field="*{availableTotalVipSlot}"
							class="form-control">
					</div>

					<div class="col-md-6">
						<label class="form-label">Status</label> <select
							th:field="*{status}" class="form-select">
							<option th:each="s : ${statuses}" th:value="${s.code}"
								th:text="${s.desc}"></option>
						</select>
					</div>
					<div class="col-md-6 d-flex align-items-end">
						<div class="form-check form-switch">
							<input class="form-check-input" type="checkbox"
								th:field="*{slotTrackingEnabled}" id="slotTrackingEnabled">
							<label class="form-check-label" for="slotTrackingEnabled">Enable
								Slot-Level Tracking</label>
						</div>
					</div>

					<div class="col-12 mt-4">
						<button type="submit" class="btn btn-primary">
							<i class="bi bi-check-lg"></i> Save
						</button>
						<a th:href="@{/parking-areas}" class="btn btn-outline-secondary">Cancel</a>
						<span class="text-muted small ms-2"
							th:if="${parkingAreaDTO.id != null and parkingAreaDTO.slotTrackingEnabled}">
							<i class="bi bi-info-circle"></i> Manage individual parking slots
							for this area from the Parking Slots screen.
						</span>
					</div>
				</form>
			</div>
		</div>

	</div>
</body>
</html>
