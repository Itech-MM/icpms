<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ICPMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">

<div class="card login-card shadow">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <i class="bi bi-p-circle-fill text-primary" style="font-size:2.5rem;"></i>
            <h4 class="mt-2 mb-0">ICPMS Admin</h4>
            <small class="text-muted">Intelligent Car Park Management System</small>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2">
            Invalid phone number or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="username" class="form-control" placeholder="e.g. 0123456789" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>
    </div>
</div>

</body>
</html>
