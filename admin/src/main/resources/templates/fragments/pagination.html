<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Usage from a list page (controller must put "pageUrlPrefix" in the model,
  a full relative URL ending with "&page=", e.g. "/sites?name=abc&size=10&page="):

  <div th:replace="~{fragments/pagination :: pager(${result}, ${pageUrlPrefix})}"></div>
-->
<div th:fragment="pager(result, pageUrlPrefix)" class="d-flex justify-content-between align-items-center mt-3" th:if="${result != null and result.totalPage != null and result.totalPage > 1}">
    <div class="text-muted small">
        Page <span th:text="${result.pageNo + 1}">1</span> of <span th:text="${result.totalPage}">1</span>
        &mdash; <span th:text="${result.totalRecords}">0</span> record(s)
    </div>
    <nav>
        <ul class="pagination pagination-sm mb-0">
            <li class="page-item" th:classappend="${result.pageNo <= 0} ? 'disabled'">
                <a class="page-link" th:href="${pageUrlPrefix + (result.pageNo - 1)}">Previous</a>
            </li>
            <li class="page-item" th:each="p : ${#numbers.sequence(0, result.totalPage - 1)}"
                th:classappend="${p == result.pageNo} ? 'active'">
                <a class="page-link" th:href="${pageUrlPrefix + p}" th:text="${p + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${result.hasNextPage == false} ? 'disabled'">
                <a class="page-link" th:href="${pageUrlPrefix + (result.pageNo + 1)}">Next</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
