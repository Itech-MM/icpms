<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<nav class="sidebar" id="sidebar" th:fragment="sidebar">
		<div class="sidebar-brand">
			<i class="bi bi-p-circle-fill"></i> <span>ICPMS Admin</span>
			<button type="button"
				class="btn-close btn-close-white ms-auto d-lg-none"
				id="sidebarClose" aria-label="Close"></button>
		</div>

		<ul class="nav flex-column" id="sidebarMenu" th:if="${menus != null}">
			<th:block th:each="menu : ${menus}" th:if="${menu != null}">
				<th:block th:replace="~{::menuItem(${menu})}"></th:block>
			</th:block>
		</ul>

		<div class="sidebar-footer">
			<span>&copy; <span
				th:text="${#dates.year(#dates.createNow())}">2026</span> FlexiTech
			</span> <span class="sidebar-version"
				th:text="'v' + ${@environment.getProperty('app.version', 'dev')}">v1.0.0</span>
		</div>
	</nav>

	<li class="nav-item" th:fragment="menuItem(menu)"><th:block
			th:if="${menu.children == null or #lists.isEmpty(menu.children)}">
			<a class="nav-link"
				th:classappend="${activeMenu == menu.code} ? 'active'"
				th:href="@{${menu.url}}"> <i
				th:if="${not #strings.isEmpty(menu.icon)}"
				th:class="'bi ' + ${menu.icon}"></i> <span th:text="${menu.name}">Menu</span>
			</a>
		</th:block> <th:block
			th:unless="${menu.children == null or #lists.isEmpty(menu.children)}"
			th:with="open=${activeMenu == menu.code or not #lists.isEmpty(menu.children.?[code == #vars.activeMenu])}">
			<a class="nav-link nav-parent"
				th:classappend="${open} ? 'has-active'" data-bs-toggle="collapse"
				th:href="'#menu-' + ${menu.code}" role="button"
				th:aria-expanded="${open}" th:aria-controls="'menu-' + ${menu.code}">
				<i th:if="${not #strings.isEmpty(menu.icon)}"
				th:class="'bi ' + ${menu.icon}"></i> <span th:text="${menu.name}">Menu</span>
				<i class="bi bi-chevron-down small submenu-caret"></i>
			</a>
			<div class="collapse" th:id="'menu-' + ${menu.code}"
				data-bs-parent="#sidebarMenu" th:classappend="${open} ? 'show'">
				<ul class="nav flex-column sub-nav">
					<li class="nav-item" th:each="child : ${menu.children}"><a
						class="nav-link"
						th:classappend="${activeMenu == child.code} ? 'active'"
						th:href="@{${child.url}}"><span th:text="${child.name}">Child</span></a>
					</li>
				</ul>
			</div>
		</th:block></li>
</body>
</html>
